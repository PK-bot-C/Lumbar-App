<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0b"><title>Lumbar</title>
<style>
:root{--ac:#3ee6c4;--bg:#0a0a0b;--cd:#151517;--bd:#26262a;--mu:#9a9aa2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2f2f0;font-family:"Chakra Petch",system-ui,sans-serif;max-width:430px;margin:auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
.m{font-family:ui-monospace,Menlo,monospace}.k{font-size:10px;letter-spacing:.14em;color:var(--mu)}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:12px}
button{font:inherit;color:inherit;min-height:48px;border-radius:14px;border:1px solid #2c2c31;background:#1d1d20;letter-spacing:.1em;touch-action:none;user-select:none;-webkit-user-select:none}
.pr{background:var(--ac);color:#04110e;border-color:var(--ac);font-weight:700}
.chip{flex:1;text-align:center;padding:7px 2px;border:1px solid var(--bd);border-radius:8px;font-size:8.5px;color:#6b6b73}.chip.on{border-color:var(--ac);color:var(--ac);background:#0e2a25}
#map{position:relative;height:560px;padding:0;overflow:hidden}#map svg{position:absolute;inset:0;width:100%;height:100%}
.zr{position:absolute;left:168px;right:10px;display:flex;gap:6px}.zr button{width:44px;height:60px;font-size:28px;padding:0}
.pad{flex:1;height:60px;border:1px solid var(--ac);border-radius:14px;position:relative;overflow:hidden;padding:8px}.pad i{position:absolute;inset:0;background:var(--ac);opacity:.1}.pad>*{position:relative}
.t{display:grid;grid-template-columns:repeat(6,1fr);font-size:10.5px;margin-top:6px}.t b{font-weight:500;color:#6b6b73;font-size:9px;padding:4px 0}.t span{padding:6px 0;border-top:1px solid var(--bd)}
.d{display:inline-block;width:7px;height:7px;border-radius:4px;background:#2c2c31}.d.on{background:var(--ac)}.er{color:#ff6b3d}
</style></head><body>
<div class="row"><div><div style="font-size:22px;font-weight:700;letter-spacing:.2em">LUMBAR</div><div class="k">4-ZONE AIRBAG CONTROL</div></div><button id="cb" class="pr" style="width:112px">CONNECT</button></div>
<div class="c row" id="ac" style="gap:12px"><div><div class="k" id="mode">NOT CONNECTED</div><div id="st" style="font-size:19px;font-weight:700;margin-top:2px">OFFLINE</div></div><button id="ab" style="width:104px">AUTO</button></div>
<div class="c"><div class="row k"><span>STATE MACHINE</span><span class="m" id="fl"></span></div><div class="row" id="ch" style="gap:4px;margin-top:8px"></div></div>
<div class="c" id="map"></div>
<div class="row" style="gap:10px;margin-top:12px"><button id="da" style="flex:1">DEFLATE ALL</button><button id="rs" style="flex:1">RE-SENSE</button><button id="ia" class="pr" style="flex:1">INFLATE ALL</button></div>
<div class="k" style="text-align:center;margin-top:8px">HOLD + OR − · MANUAL HOLDS UNTIL YOU SIT AGAIN OR PRESS AUTO</div>
<div id="eng"></div>
<div class="row" style="gap:10px;margin-top:12px"><button id="tb" style="flex:1">TARE (SEAT EMPTY)</button><button id="fb" style="flex:1">CLEAR FAULT</button></div>
<script>
const U={svc:'7a3f0001-8c1e-4f6a-9b2d-5e1c0a4d7b10',cmd:'7a3f0002-8c1e-4f6a-9b2d-5e1c0a4d7b10',sta:'7a3f0003-8c1e-4f6a-9b2d-5e1c0a4d7b10',zon:'7a3f0004-8c1e-4f6a-9b2d-5e1c0a4d7b10',tar:'7a3f0005-8c1e-4f6a-9b2d-5e1c0a4d7b10'};
const N=['TOP','MID','BOT','SUB'],PIN=[[14,17,36],[27,18,39],[26,19,32],[25,23,33]],STN=['STANDBY','SENSE: DEFLATE','SENSE: INFLATE','COMPENSATING','LOCKED MONITOR'],CH=['STANDBY','DEFLATE','INFLATE','COMPENSATE','LOCKED'];
const Z=N.map(()=>({p:0,f:0,t:0,a:0,r:0,at:0,ft:0})),S={s:0,fl:0,fa:0,pm:0,vm:0,cmd:0,res:0};
let dev,cmdC,q=Promise.resolve(),on=false;
const $=id=>document.getElementById(id);
const ys=[120,190,260,330];
$('ch').innerHTML=CH.map(c=>`<div class="chip">${c}</div>`).join('');
$('map').innerHTML=`<svg viewBox="0 0 358 560" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#1b1b1e"/></pattern></defs><rect width="358" height="560" fill="url(#g)"/><path id="tor" fill="#fff" fill-opacity=".04"/><rect x="20" y="50" width="36" height="396" rx="16" fill="#111113" stroke="#3a3a40" stroke-width="2"/><rect x="20" y="446" width="140" height="44" rx="14" fill="#111113" stroke="#3a3a40" stroke-width="2"/><path d="M90 490V532M50 540H130" stroke="#3a3a40" stroke-width="3"/><g id="bags"></g><path id="con" fill="none" stroke="#f2f2f0" stroke-opacity=".7" stroke-width="2" stroke-linejoin="round"/><g id="vt"></g></svg><div class="k" style="position:absolute;left:12px;top:12px">LIVE SEAT MAP</div><div class="k m" style="position:absolute;right:12px;top:12px">BULGE = kPa · GLOW = FSR</div>`+
N.map((n,i)=>`<div class="zr" style="top:${ys[i]}px"><button data-z="${i}" data-d="2" aria-label="Deflate ${n}">−</button><div class="pad"><i id="gl${i}"></i><span class="m" style="font-size:15px" id="pk${i}"></span><div class="row"><span class="m" style="font-size:13px" id="pf${i}"></span><span class="k m"><span class="d" id="pp${i}"></span> <span class="d" id="pv${i}"></span></span></div></div><button class="pr" data-z="${i}" data-d="1" aria-label="Inflate ${n}">+</button></div>`).join('');
function lerp(pts,y){for(let i=0;i<pts.length-1;i++){const[a,b]=[pts[i],pts[i+1]];if(y>=a[1]&&y<=b[1])return a[0]+(b[0]-a[0])*(y-a[1])/(b[1]-a[1]);}return 62}
function draw(){
 const pk=Z.map(z=>56+12+14*Math.min(z.p,5.5)),pts=[[60,60],[62,110],...pk.map((x,i)=>[x,ys[i]+30]),[62,440]];
 $('con').setAttribute('d','M'+pts.map(p=>p.join(' ')).join('L'));
 $('tor').setAttribute('d','M'+pts.map(p=>p.join(' ')).join('L')+'L150 440L150 60Z');
 $('bags').innerHTML=Z.map((z,i)=>`<path d="M56 ${ys[i]}Q${56+2*(pk[i]-56)} ${ys[i]+30} 56 ${ys[i]+60}Z" fill="#3ee6c4" fill-opacity="${.12+z.f/120}" stroke="#3ee6c4" stroke-width="1.5"/><path d="M${pk[i]+6} ${ys[i]+30}H166" stroke="#3ee6c4" stroke-opacity=".35" stroke-dasharray="2 4"/><circle cx="${pk[i]}" cy="${ys[i]+30}" r="3.5" fill="#fff"/><text x="38" y="${ys[i]+33}" text-anchor="middle" fill="#9a9aa2" font-size="9" font-family="monospace">${N[i]}</text>`).join('');
 let v='';for(let y=76;y<436;y+=26)v+=`<circle cx="${lerp(pts,y)+26}" cy="${y}" r="4.5" fill="#2a2a2f" stroke="#4a4a52"/>`;$('vt').innerHTML=v;
 Z.forEach((z,i)=>{$('pk'+i).innerHTML=z.p.toFixed(1)+'<span class="k"> kPa</span>';$('pf'+i).textContent=z.f+'%';$('gl'+i).style.opacity=.06+z.f/200;$('pp'+i).className='d'+(S.pm>>i&1?' on':'');$('pv'+i).className='d'+(S.vm>>i&1?' on':'')});
 document.querySelectorAll('.chip').forEach((c,i)=>c.classList.toggle('on',on&&i==S.s));
 $('st').textContent=!on?'OFFLINE':(S.fl&1?STN[S.s]:'MANUAL HOLD');$('mode').textContent=!on?'NOT CONNECTED':S.fl&1?'MODE · AUTO ENGAGED':'MODE · MANUAL';
 $('ab').className=S.fl&1&&on?'pr':'';$('ab').textContent=S.fl&1?'AUTO ON':'AUTO';
 $('fl').textContent=on?(S.fl&2?'SEATED':'EMPTY')+(S.fa?' · FAULT 0x'+S.fa.toString(16):''):'';$('fl').className='m'+(S.fa?' er':'');
 const T=(h,c,r)=>`<div class="c"><div class="k">${h}</div><div class="t m">${c.map(x=>`<b>${x}</b>`).join('')}${r.map(a=>a.map((x,j)=>`<span${j==1?' style="color:#3ee6c4"':''}>${x}</span>`).join('')).join('')}</div></div>`;
 $('eng').innerHTML=T('ENGINEERING · PRESSURE',['ZONE','kPa','TARGET','AIR mV','TARE mV','Δ mV'],Z.map((z,i)=>[N[i],z.p.toFixed(2),z.t.toFixed(1),z.a,z.at,z.a-z.at]))+
 T('ENGINEERING · FORCE (ADS1115)',['ZONE','FSR %','RAW','TARE','Δ','CH'],Z.map((z,i)=>[N[i],z.f,z.r,z.ft,z.r-z.ft,'A'+i]))+
 T('ENGINEERING · OUTPUTS &amp; PINS',['ZONE','PUMP','VALVE','AIR IN','PUMP IO','VALVE IO'],Z.map((z,i)=>[N[i],S.pm>>i&1?'ON':'OFF',S.vm>>i&1?'ON':'OFF','G'+PIN[i][2],'G'+PIN[i][0],'G'+PIN[i][1]]));
}
function send(a){if(!cmdC)return;q=q.then(()=>cmdC.writeValueWithoutResponse(new Uint8Array(a))).catch(()=>{})}
const timers={};
document.querySelectorAll('.zr button').forEach(b=>{const z=+b.dataset.z,d=+b.dataset.d;
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);send([0x10,z,d]);clearInterval(timers[z]);timers[z]=setInterval(()=>send([0x10,z,d]),150)});
 const end=()=>{if(timers[z]){clearInterval(timers[z]);timers[z]=0;send([0x10,z,0])}};
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,end));b.addEventListener('contextmenu',e=>e.preventDefault())});
function holdAll(id,d){const b=$(id);let t;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);send([0x11,d]);t=setInterval(()=>send([0x11,d]),150)});const end=()=>{if(t){clearInterval(t);t=0;send([0x11,0])}};['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,end))}
holdAll('da',2);holdAll('ia',1);
$('ab').onclick=()=>send([S.fl&1?0x02:0x01]);$('rs').onclick=()=>send([0x01]);$('tb').onclick=()=>send([0x20]);$('fb').onclick=()=>send([0x21]);
document.addEventListener('visibilitychange',()=>{if(document.hidden){send([0x11,0]);send([0x03])}});
function pT(v){for(let i=0;i<4;i++){Z[i].at=v.getInt16(i*4,true);Z[i].ft=v.getInt16(i*4+2,true)}draw()}
async function connect(){
 try{
  dev=await navigator.bluetooth.requestDevice({filters:[{services:[U.svc]}]});
  dev.addEventListener('gattserverdisconnected',()=>{on=false;cmdC=null;$('cb').textContent='CONNECT';draw()});
  $('cb').textContent='...';
  const sv=await(await dev.gatt.connect()).getPrimaryService(U.svc);
  cmdC=await sv.getCharacteristic(U.cmd);
  const sta=await sv.getCharacteristic(U.sta),zon=await sv.getCharacteristic(U.zon),tar=await sv.getCharacteristic(U.tar);
  sta.addEventListener('characteristicvaluechanged',e=>{const v=e.target.value;Object.assign(S,{s:v.getUint8(1),fl:v.getUint8(2),fa:v.getUint8(3),pm:v.getUint8(4),vm:v.getUint8(5),cmd:v.getUint8(6),res:v.getUint8(7)});draw()});
  zon.addEventListener('characteristicvaluechanged',e=>{const v=e.target.value,z=Z[v.getUint8(0)];if(!z)return;z.p=v.getInt16(1,true)/100;z.f=v.getUint8(3);z.t=v.getInt16(4,true)/100;z.a=v.getInt16(6,true);z.r=v.getInt16(8,true)});
  tar.addEventListener('characteristicvaluechanged',e=>pT(e.target.value));
  await sta.startNotifications();await zon.startNotifications();await tar.startNotifications();
  pT(await tar.readValue());on=true;$('cb').textContent='LINKED';draw();
 }catch(err){on=false;$('cb').textContent='CONNECT';alert('Bluetooth: '+err.message)}
}
$('cb').onclick=()=>{if(on&&dev){dev.gatt.disconnect()}else if(navigator.bluetooth)connect();else alert('Web Bluetooth not available. Use Chrome on Android over https.')};
draw();
</script></body></html>
